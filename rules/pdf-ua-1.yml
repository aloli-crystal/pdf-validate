# PDF/UA-1 conformance rule set (ISO 14289-1).
#
# First palier : document-level accessibility requirements checkable
# from the catalog and XMP metadata. Per-element rules (Alt on
# figures, heading order, table headers, content tagged-or-artifact)
# are added in later paliers.

- id: pdfua1-5-pdfuaid-part
  clause: "ISO 14289-1 § 5"
  title: "PDF/UA identification (pdfuaid:part) present in XMP"
  severity: error
  check: xmp_property_present
  args: ["pdfuaid:part"]

- id: pdfua1-7.1-struct-tree-root
  clause: "ISO 14289-1 § 7.1"
  title: "Document has a logical structure tree (Tagged PDF)"
  severity: error
  check: catalog_key_present
  args: ["StructTreeRoot"]

- id: pdfua1-7.1-mark-info
  clause: "ISO 14289-1 § 7.1"
  title: "Document declares /MarkInfo (marked content)"
  severity: error
  check: catalog_key_present
  args: ["MarkInfo"]

- id: pdfua1-7.2-lang
  clause: "ISO 14289-1 § 7.2"
  title: "Document declares a default natural language (/Lang)"
  severity: error
  check: catalog_key_present
  args: ["Lang"]

- id: pdfua1-7.1-viewer-prefs
  clause: "ISO 14289-1 § 7.1"
  title: "Document sets /ViewerPreferences (DisplayDocTitle)"
  severity: error
  check: catalog_key_present
  args: ["ViewerPreferences"]

- id: pdfua1-7.1-metadata
  clause: "ISO 14289-1 § 7.1"
  title: "Document catalog has an XMP /Metadata stream"
  severity: error
  check: catalog_key_present
  args: ["Metadata"]

# --- Per-element structure-tree rules (ISO 14289-1 § 7.2–7.9) ---

- id: pdfua1-7.1-struct-parent
  clause: "ISO 14289-1 § 7.1"
  title: "Every structure element has a /P (parent) entry"
  severity: error
  check: struct_elements_have_parent
  args: []

- id: pdfua1-7.3-figure-alt
  clause: "ISO 14289-1 § 7.3"
  title: "Figure and Formula structure elements have /Alt or /ActualText"
  severity: error
  check: struct_alt_text_present
  args: []

- id: pdfua1-7.2-table-cells
  clause: "ISO 14289-1 § 7.2"
  title: "TH and TD structure elements are contained in a TR"
  severity: error
  check: table_cells_in_row
  args: []

- id: pdfua1-7.9-note-id
  clause: "ISO 14289-1 § 7.9"
  title: "Note structure elements have a non-empty, unique /ID"
  severity: error
  check: notes_have_unique_id
  args: []

- id: pdfua1-7.4.4-heading-structure
  clause: "ISO 14289-1 § 7.4.4"
  title: "Headings are either weak (H) or strong (H1-H6), not both; at most one child H per node"
  severity: error
  check: heading_structure_valid
  args: []

- id: pdfua1-7.2-attribute-language
  clause: "ISO 14289-1 § 7.2"
  title: "Alt/ActualText/E attributes have a determinable natural language"
  severity: error
  check: attribute_language_determinable
  args: []

- id: pdfua1-7.4.2-heading-nesting
  clause: "ISO 14289-1 § 7.4.2"
  title: "Numbered headings do not skip levels (first is H1; deeper by at most one)"
  severity: error
  check: heading_nesting_valid
  args: []

- id: pdfua1-7.1-rolemap
  clause: "ISO 14289-1 § 7.1"
  title: "/RoleMap does not remap standard types and has no circular mapping"
  severity: error
  check: rolemap_valid
  args: []
