# PDF/A-2b conformance rule set (ISO 19005-2:2011, level B).
#
# Clause numbers are reconciled with the veraPDF 1.30.1 validation
# profile (the open, authoritative encoding of ISO 19005-2 maintained
# by the veraPDF consortium / PDF Association). The ISO standard text
# itself is paywalled and is NOT reproduced here ; only clause numbers
# and short factual rule labels are used.
#
# This rule set covers the document- and resource-level requirements
# the engine can currently check. It is a *focused subset* of the 144
# rules veraPDF applies — see doc/iso-19005-2-gap-analysis.adoc for
# the full état des lieux and the prioritised backlog.

# --- § 6.1 File structure ---

- id: pdfa2-6.1.2-file-header
  clause: "ISO 19005-2 § 6.1.2"
  title: "File begins with %PDF-1.n + EOL and a binary-marker comment (≥ 4 bytes > 127)"
  severity: error
  check: file_header_valid
  args: []

- id: pdfa2-6.1.3-no-data-after-eof
  clause: "ISO 19005-2 § 6.1.3"
  title: "No data after the final %%EOF except a single optional EOL"
  severity: error
  check: no_data_after_eof
  args: []

- id: pdfa2-6.1.6-hex-strings
  clause: "ISO 19005-2 § 6.1.6"
  title: "Hexadecimal strings have an even count of hex digits only"
  severity: error
  check: hex_strings_valid
  args: []

- id: pdfa2-6.1.7.1-stream-eol
  clause: "ISO 19005-2 § 6.1.7.1"
  title: "stream keyword followed by CRLF/LF; endstream preceded by an EOL"
  severity: error
  check: stream_keyword_eol_valid
  args: []

- id: pdfa2-6.1.9-indirect-spacing
  clause: "ISO 19005-2 § 6.1.9"
  title: "Indirect objects/references use single white-space separators"
  severity: error
  check: indirect_object_spacing_valid
  args: []

- id: pdfa2-6.1.13-implementation-limits
  clause: "ISO 19005-2 § 6.1.13"
  title: "Implementation limits: number ranges, name/string lengths, object count, DeviceN colorants, page box sizes"
  severity: error
  check: implementation_limits_respected
  args: []

- id: pdfa2-6.1.3-no-encryption
  clause: "ISO 19005-2 § 6.1.3"
  title: "The trailer shall not contain the Encrypt key"
  severity: error
  check: trailer_key_absent
  args: ["Encrypt"]

- id: pdfa2-6.1.3-file-id
  clause: "ISO 19005-2 § 6.1.3"
  title: "The trailer shall contain a file identifier (/ID)"
  severity: error
  check: trailer_key_present
  args: ["ID"]

- id: pdfa2-6.1.7.1-no-external-streams
  clause: "ISO 19005-2 § 6.1.7.1"
  title: "A stream dictionary shall not reference an external file (/F, /FFilter, /FDecodeParms)"
  severity: error
  check: no_external_stream_files
  args: []

- id: pdfa2-6.1.7.2-stream-filters
  clause: "ISO 19005-2 § 6.1.7.2"
  title: "Stream filters shall be ISO 32000-1 standard filters (no LZWDecode)"
  severity: error
  check: stream_filters_allowed
  args: []

# --- § 6.2 Graphics (colour & fonts) ---

- id: pdfa2-6.2.2-defined-operators
  clause: "ISO 19005-2 § 6.2.2"
  title: "Content streams shall use only ISO 32000-1 operators"
  severity: error
  check: content_operators_defined
  args: []

- id: pdfa2-6.2.10-output-intent
  clause: "ISO 19005-2 § 6.2.10"
  title: "Device colour spaces require a PDF/A OutputIntent (present)"
  severity: error
  check: catalog_key_present
  args: ["OutputIntents"]

- id: pdfa2-6.2.4.3-image-colorspaces
  clause: "ISO 19005-2 § 6.2.4.3"
  title: "Image DeviceRGB/DeviceCMYK requires a device-independent default (OutputIntent)"
  severity: error
  check: image_colorspaces_calibrated
  args: []

- id: pdfa2-6.2.4.3-content-device-colours
  clause: "ISO 19005-2 § 6.2.4.3"
  title: "Content-stream DeviceRGB/CMYK/Gray require a matching OutputIntent or Default* space"
  severity: error
  check: device_colours_anchored
  args: []

- id: pdfa2-6.2.4.2-iccbased-profile
  clause: "ISO 19005-2 § 6.2.4.2"
  title: "ICCBased colour space profile: valid device class and colour space"
  severity: error
  check: iccbased_profiles_valid
  args: []

- id: pdfa2-6.2.11.4.1-fonts-embedded
  clause: "ISO 19005-2 § 6.2.11.4.1"
  title: "Font programs for all rendered fonts shall be embedded"
  severity: error
  check: all_fonts_embedded
  args: []

- id: pdfa2-6.2.5-extgstate-no-transfer
  clause: "ISO 19005-2 § 6.2.5"
  title: "ExtGState shall not contain /TR or /HTP, and /TR2 only with value /Default"
  severity: error
  check: extgstate_no_transfer_functions
  args: []

- id: pdfa2-6.2.9-no-forbidden-xobjects
  clause: "ISO 19005-2 § 6.2.9"
  title: "No PostScript, reference (/Ref) or OPI XObjects"
  severity: error
  check: no_forbidden_xobjects
  args: []

- id: pdfa2-6.2.10-standard-blend-modes
  clause: "ISO 19005-2 § 6.2.10"
  title: "ExtGState blend modes (/BM) shall be ISO 32000-1 standard modes"
  severity: error
  check: standard_blend_modes
  args: []

- id: pdfa2-6.2.3-output-intent-profile
  clause: "ISO 19005-2 § 6.2.3"
  title: "DestOutputProfile shall be a prtr/mntr ICC profile (RGB/CMYK/GRAY, version < 5); shared & no PDF/X ref"
  severity: error
  check: output_intent_profiles_valid
  args: []

- id: pdfa2-6.2.6-rendering-intent
  clause: "ISO 19005-2 § 6.2.6"
  title: "Rendering intents shall be one of the four ISO 32000-1 values"
  severity: error
  check: rendering_intents_valid
  args: []

- id: pdfa2-6.2.8-image-dictionary-keys
  clause: "ISO 19005-2 § 6.2.8"
  title: "Image XObject keys: no /Alternates, no /OPI, /Interpolate false, valid /BitsPerComponent"
  severity: error
  check: image_dictionary_keys_valid
  args: []

# --- § 6.3 Annotations ---

- id: pdfa2-6.3.1-annotation-types
  clause: "ISO 19005-2 § 6.3.1"
  title: "Annotation subtypes shall be ISO 32000-1 types (no 3D/Sound/Screen/Movie)"
  severity: error
  check: annotation_types_allowed
  args: []

- id: pdfa2-6.3.2-annotation-flags
  clause: "ISO 19005-2 § 6.3.2"
  title: "Annotations carry /F (except Popup); Print set, Hidden/Invisible/NoView/ToggleNoView clear"
  severity: error
  check: annotation_flags_valid
  args: []

- id: pdfa2-6.3.3-annotation-appearances
  clause: "ISO 19005-2 § 6.3.3"
  title: "Annotations have a conformant appearance (/AP with only /N; correct N type)"
  severity: error
  check: annotation_appearances_valid
  args: []

# --- § 6.4 Interactive forms & signatures ---

- id: pdfa2-6.4.1-interactive-forms
  clause: "ISO 19005-2 § 6.4.1"
  title: "Widgets/fields free of /A and /AA; AcroForm /NeedAppearances not true"
  severity: error
  check: interactive_forms_valid
  args: []

- id: pdfa2-6.4.2-no-dynamic-forms
  clause: "ISO 19005-2 § 6.4.2"
  title: "No /XFA in AcroForm and no /NeedsRendering in the catalog"
  severity: error
  check: no_dynamic_forms
  args: []

- id: pdfa2-6.4.3-signature-byterange
  clause: "ISO 19005-2 § 6.4.3"
  title: "A signature's /ByteRange shall cover the entire document"
  severity: error
  check: signature_byterange_valid
  args: []

# --- § 6.5 Actions ---

- id: pdfa2-6.5.1-no-javascript
  clause: "ISO 19005-2 § 6.5.1"
  title: "No JavaScript (or other forbidden) actions"
  severity: error
  check: no_javascript
  args: []

- id: pdfa2-6.5.2-no-catalog-aa
  clause: "ISO 19005-2 § 6.5.2"
  title: "The document Catalog shall not include an /AA additional-actions entry"
  severity: error
  check: catalog_key_absent
  args: ["AA"]

# --- § 6.6 Metadata ---

- id: pdfa2-6.6.2.1-metadata-present
  clause: "ISO 19005-2 § 6.6.2.1"
  title: "The Catalog shall contain an XMP /Metadata stream"
  severity: error
  check: catalog_key_present
  args: ["Metadata"]

- id: pdfa2-6.6.2.1-xmp-well-formed
  clause: "ISO 19005-2 § 6.6.2.1"
  title: "XMP packet: no bytes/encoding header attribute, well-formed XML"
  severity: error
  check: xmp_well_formed
  args: []

- id: pdfa2-6.6.4-pdfaid-part
  clause: "ISO 19005-2 § 6.6.4"
  title: "PDF/A version identification (pdfaid:part) present in XMP"
  severity: error
  check: xmp_property_present
  args: ["pdfaid:part"]

- id: pdfa2-6.6.4-pdfaid-conformance
  clause: "ISO 19005-2 § 6.6.4"
  title: "PDF/A conformance level (pdfaid:conformance) present in XMP"
  severity: error
  check: xmp_property_present
  args: ["pdfaid:conformance"]

- id: pdfa2-6.6.4-pdfaid-part-2
  clause: "ISO 19005-2 § 6.6.4"
  title: "Declared PDF/A part is 2"
  severity: error
  check: xmp_property_equals
  args: ["pdfaid:part", "2"]

- id: pdfa2-6.6.2.3-extension-schema
  clause: "ISO 19005-2 § 6.6.2.3"
  title: "PDF/A extension schema structure (pdfaSchema/Property/Type/Field) is well-formed"
  severity: error
  check: xmp_extension_schema_valid
  args: []

- id: pdfa2-6.6.4-conformance-level
  clause: "ISO 19005-2 § 6.6.4"
  title: "pdfaid:conformance is A, B or U"
  severity: error
  check: pdfaid_conformance_valid
  args: []

# --- § 6.8 Embedded files ---

- id: pdfa2-6.8-embedded-filespec
  clause: "ISO 19005-2 § 6.8"
  title: "A file specification with an embedded file (/EF) shall contain /F and /UF"
  severity: error
  check: embedded_filespecs_valid
  args: []

# --- § 6.9 Optional content ---

- id: pdfa2-6.9-optional-content
  clause: "ISO 19005-2 § 6.9"
  title: "OCG configuration dictionaries: non-empty unique /Name, no /AS"
  severity: error
  check: optional_content_valid
  args: []

# --- § 6.10 Alternate presentations ---

- id: pdfa2-6.10-no-alternate-presentations
  clause: "ISO 19005-2 § 6.10"
  title: "No /AlternatePresentations (Names) and no /PresSteps (pages)"
  severity: error
  check: no_alternate_presentations
  args: []

# --- § 6.11 Requirements ---

- id: pdfa2-6.11-no-requirements
  clause: "ISO 19005-2 § 6.11"
  title: "The document Catalog shall not contain the /Requirements key"
  severity: error
  check: catalog_key_absent
  args: ["Requirements"]
